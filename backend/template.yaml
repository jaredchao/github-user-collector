AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GitHub user collector - Lambda behind API Gateway, inside an existing VPC

Parameters:
  # Two scalar parameters rather than a List: a comma-separated list has to be
  # escaped on the deploy command line, which is easy to get wrong.
  SubnetIdA:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in the first availability zone

  SubnetIdB:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in the second availability zone

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowed to reach RDS on 5432

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: postgres://user:password@rds-endpoint:5432/github_users?sslmode=no-verify

  CorsOrigins:
    Type: String
    Default: ""
    Description: Comma-separated allowed origins. Empty means any origin.

  GoServiceUrl:
    Type: String
    Default: http://go-service.zuoye.internal:8080
    Description: Cloud Map address of the Go intro service. PR stacks point at go-service-pr-N.

  CloudMapNamespaceId:
    Type: String
    Default: ns-m5syodpxwy3gzlo3
    Description: >-
      The zuoye.api HTTP namespace. DNS namespaces reject services without a
      DnsConfig, and Lambda has no IP to put in one, so API-type
      registrations live in an HTTP namespace instead.

  CloudMapServiceName:
    Type: String
    Default: collector-lambda
    Description: Cloud Map service name registering this stack's Lambda. PR stacks use collector-lambda-pr-N.

  GoPublicHost:
    Type: String
    Default: main.go-api.jccode.cc
    Description: Public host of the Go front door, probed by the synthetics canary.

  CanaryIntervalMinutes:
    Type: Number
    Default: 60
    Description: How often the synthetics canary runs. Hourly keeps it near free.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    # GitHub fetch times out at 5s; leave room for a cold start plus the database write.
    Timeout: 15
    MemorySize: 512

Resources:
  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      # No FunctionName: CloudFormation generates a stack-scoped name, so the
      # per-PR stacks (zuoye-collector-pr-N) don't collide with production.
      CodeUri: dist/
      Handler: index.handler
      Description: Accepts collect requests and serves reads
      # Every deployment publishes a new version and shifts the alias onto it
      # gradually: 10% of traffic for five minutes, then the rest. If either
      # alarm below fires while that is happening, CodeDeploy puts all traffic
      # back on the previous version.
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref CanaryDeploymentErrorAlarm
          - !Ref CanaryDeploymentLatencyAlarm
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          CORS_ORIGINS: !Ref CorsOrigins
          GO_SERVICE_URL: !Ref GoServiceUrl
          COLLECT_TOPIC_ARN: !Ref CollectRequestsTopic
          # The pg pool lives at module scope; keep the container alive between calls.
          NODE_OPTIONS: --enable-source-maps
      VpcConfig:
        SubnetIds: [!Ref SubnetIdA, !Ref SubnetIdB]
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      # Grants the ENI permissions a VPC-attached function needs.
      Policies:
        - VPCAccessPolicy: {}
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CollectRequestsTopic.TopicName
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Hono owns CORS so that error responses carry the headers too.
      Description: Public entry point for the collector

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CollectorFunction}
      RetentionInDays: 7

  # ---- Async collection: SNS -> SQS -> worker, with a dead letter queue ----
  #
  # The API only publishes here and answers 202, so a GitHub outage or a slow
  # database can no longer turn into a failed user request: the message waits
  # in the queue and is retried.

  CollectRequestsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Collect requests accepted by the API

  # Retries are capped by maxReceiveCount below; whatever still fails lands
  # here, where it can be inspected and replayed rather than lost.
  CollectDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  CollectQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Must exceed the worker's own timeout, or SQS hands the same message to
      # a second worker while the first is still busy with it.
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CollectDeadLetterQueue.Arn
        maxReceiveCount: 3

  CollectQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref CollectRequestsTopic
      Endpoint: !GetAtt CollectQueue.Arn
      # Without this the worker would have to unwrap an SNS envelope around
      # every message body.
      RawMessageDelivery: true

  CollectQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref CollectQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt CollectQueue.Arn
            Condition:
              ArnEquals: {"aws:SourceArn": !Ref CollectRequestsTopic}

  CollectWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: worker.handler
      Description: Consumes collect requests and upserts GitHub users into RDS
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          NODE_OPTIONS: --enable-source-maps
      VpcConfig:
        SubnetIds: [!Ref SubnetIdA, !Ref SubnetIdB]
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Policies:
        - VPCAccessPolicy: {}
      Events:
        CollectQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt CollectQueue.Arn
            BatchSize: 5
            # Lets the worker fail one message without dragging its healthy
            # batch mates back onto the queue.
            FunctionResponseTypes: [ReportBatchItemFailures]

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CollectWorkerFunction}
      RetentionInDays: 7

  # ---- Alerting ----

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: zuoye operational alerts

  # A message in the DLQ means three attempts were not enough: someone has to
  # look at it, so it pages rather than sitting there silently.
  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Collect requests landed in the dead letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The queue draining slower than it fills means the worker is stuck or
  # throttled; the age of the oldest message shows that before the DLQ does.
  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Collect requests are waiting too long to be processed
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---- Canary deployment guard rails ----
  #
  # Both alarms are scoped to the version being rolled out (ExecutedVersion),
  # so a pre-existing error on the old version can't block a good deployment,
  # and a bad new version trips them within the canary window.

  CanaryDeploymentErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The version being rolled out is throwing errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: Resource
          Value: !Sub "${CollectorFunction}:live"
        - Name: FunctionName
          Value: !Ref CollectorFunction
        - Name: ExecutedVersion
          Value: !GetAtt CollectorFunction.Version.Version
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  CanaryDeploymentLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The version being rolled out is far slower than usual
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: Resource
          Value: !Sub "${CollectorFunction}:live"
        - Name: FunctionName
          Value: !Ref CollectorFunction
        - Name: ExecutedVersion
          Value: !GetAtt CollectorFunction.Version.Version
      # p90 rather than average: a handful of cold starts shouldn't roll back
      # an otherwise healthy release.
      ExtendedStatistic: p90
      Period: 60
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ---- Synthetics: keep probing the real chain between deployments ----

  CanaryArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-canary-runs
            Status: Enabled
            ExpirationInDays: 14

  SyntheticsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: synthetics-run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetBucketLocation]
                Resource:
                  - !GetAtt CanaryArtifactsBucket.Arn
                  - !Sub "${CanaryArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: {"cloudwatch:namespace": CloudWatchSynthetics}

  ApiCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: zuoye-api-canary
      ArtifactS3Location: !Sub "s3://${CanaryArtifactsBucket}/canary"
      ExecutionRoleArn: !GetAtt SyntheticsRole.Arn
      # The plain nodejs runtime is enough — and cheaper — for checks that
      # never need to render a page.
      RuntimeVersion: syn-nodejs-5.2
      Schedule:
        Expression: !Sub "rate(${CanaryIntervalMinutes} minutes)"
      RunConfig:
        TimeoutInSeconds: 120
        EnvironmentVariables:
          API_HOST: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
          GO_HOST: !Ref GoPublicHost
          PROBE_USER: torvalds
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 7
      FailureRetentionPeriod: 14
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');

          const API = process.env.API_HOST;
          const GO = process.env.GO_HOST;
          const USER = process.env.PROBE_USER;
          const FRESH_MS = 15 * 60 * 1000;

          function req(host, method, path, body) {
            const o = { hostname: host, method, path, port: 443, protocol: 'https:',
              headers: { 'User-Agent': 'zuoye-synthetics', 'Content-Type': 'application/json' } };
            if (body) o.body = body;
            return o;
          }

          function expect(codes) {
            return async (res) => {
              let body = '';
              res.on('data', (d) => { body += d; });
              await new Promise((resolve) => res.on('end', resolve));
              if (!codes.includes(res.statusCode)) {
                throw new Error(`expected ${codes} got ${res.statusCode}: ${body.slice(0, 300)}`);
              }
              log.info(`${res.statusCode} ${body.slice(0, 200)}`);
              return body;
            };
          }

          exports.handler = async function () {
            await synthetics.executeHttpStep('lambda-health', req(API, 'GET', '/health'), expect([200]));
            await synthetics.executeHttpStep('front-door-health', req(GO, 'GET', '/health'), expect([200]));

            await synthetics.executeHttpStep('queue-collect',
              req(GO, 'POST', '/users', JSON.stringify({ username: USER })), expect([202]));

            // Give SNS, SQS and the worker time to do their part.
            await new Promise((resolve) => setTimeout(resolve, 12000));

            let stored = null;
            await synthetics.executeHttpStep('read-back',
              req(GO, 'GET', `/users/${USER}`),
              async (res) => { stored = JSON.parse(await expect([200])(res)); });

            // A 200 alone proves nothing — the row could be days old. Only a
            // freshly stamped updatedAt proves the async chain still runs.
            const age = Date.now() - new Date(stored.updatedAt).getTime();
            if (age > FRESH_MS) {
              throw new Error(`stale record: updated ${Math.round(age / 1000)}s ago, worker may be stuck`);
            }

            await synthetics.executeHttpStep('intro',
              req(GO, 'GET', `/intro?username=${USER}`), expect([200]));
          };

  CanaryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Synthetics probe of the collect chain is failing
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref ApiCanary
      Statistic: Average
      Period: !Sub "${CanaryIntervalMinutes}"
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # Lambda has no IP, so it can't live in a DNS record like the Go service
  # does. A service with no DnsConfig is API-discoverable only: the Go
  # service finds this function via DiscoverInstances, then invokes it.
  CollectorDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref CloudMapServiceName
      NamespaceId: !Ref CloudMapNamespaceId
      Description: API-type registration of the collector Lambda

  CollectorDiscoveryInstance:
    Type: AWS::ServiceDiscovery::Instance
    Properties:
      ServiceId: !Ref CollectorDiscoveryService
      InstanceId: collector
      InstanceAttributes:
        functionName: !Ref CollectorFunction
        arn: !GetAtt CollectorFunction.Arn

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

  FunctionName:
    Description: Lambda function name
    Value: !Ref CollectorFunction

  CollectQueueUrl:
    Description: Main collect queue
    Value: !Ref CollectQueue

  DeadLetterQueueUrl:
    Description: Dead letter queue for exhausted collect requests
    Value: !Ref CollectDeadLetterQueue

  AlertsTopicArn:
    Description: SNS topic every operational alarm publishes to
    Value: !Ref AlertsTopic
