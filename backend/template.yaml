AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GitHub user collector - Lambda behind API Gateway, inside an existing VPC

Parameters:
  # Two scalar parameters rather than a List: a comma-separated list has to be
  # escaped on the deploy command line, which is easy to get wrong.
  SubnetIdA:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in the first availability zone

  SubnetIdB:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in the second availability zone

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowed to reach RDS on 5432

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: postgres://user:password@rds-endpoint:5432/github_users?sslmode=no-verify

  CorsOrigins:
    Type: String
    Default: ""
    Description: Comma-separated allowed origins. Empty means any origin.

  GoServiceUrl:
    Type: String
    Default: http://go-service.zuoye.internal:8080
    Description: Cloud Map address of the Go intro service. PR stacks point at go-service-pr-N.

  CloudMapNamespaceId:
    Type: String
    Default: ns-m5syodpxwy3gzlo3
    Description: >-
      The zuoye.api HTTP namespace. DNS namespaces reject services without a
      DnsConfig, and Lambda has no IP to put in one, so API-type
      registrations live in an HTTP namespace instead.

  CloudMapServiceName:
    Type: String
    Default: collector-lambda
    Description: Cloud Map service name registering this stack's Lambda. PR stacks use collector-lambda-pr-N.

  GoPublicHost:
    Type: String
    Default: main.go-api.jccode.cc
    Description: Public host of the Go front door, probed by the synthetics canary.

  EnableSyntheticsCanary:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether to create the CloudWatch Synthetics canary. Off by default: it
      bills per run, and its underlying Lambda needs 960 MB, which this
      account's 512 MB cap currently refuses.

  SyntheticsScheduleMinutes:
    Type: Number
    Default: 60
    Description: How often the synthetics canary probes /ready.

  EnableCanaryDeployment:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether to shift traffic through CodeDeploy. Off by default: this
      account has no CodeDeploy subscription, so scripts/canary-release.sh
      drives the same rollout through the alias's weighted routing instead.

Conditions:
  CreateSyntheticsCanary: !Equals [!Ref EnableSyntheticsCanary, "true"]
  UseCanaryDeployment: !Equals [!Ref EnableCanaryDeployment, "true"]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    # GitHub fetch times out at 5s; leave room for a cold start plus the database write.
    Timeout: 15
    MemorySize: 512

Resources:
  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      # No FunctionName: CloudFormation generates a stack-scoped name, so the
      # per-PR stacks (zuoye-collector-pr-N) don't collide with production.
      CodeUri: dist/
      Handler: index.handler
      Description: Accepts collect requests and serves reads
      # Every deployment publishes an immutable version and points the `live`
      # alias at it; the API is wired to the alias, never to $LATEST.
      #
      # SAM would normally hand the gradual shift to CodeDeploy
      # (DeploymentPreference), but this account has no CodeDeploy
      # subscription, so scripts/canary-release.sh drives the same rollout
      # through the alias's own weighted routing instead.
      AutoPublishAlias: live
      # The managed way to shift traffic would be:
      #
      #   DeploymentPreference:
      #     Type: Canary10Percent5Minutes
      #     Alarms: [!Ref ReleaseErrorAlarm, !Ref ReleaseLatencyAlarm]
      #
      # It stays commented out because SAM turns it into CodeDeploy resources
      # even with Enabled: false, and this account has no CodeDeploy
      # subscription — CloudFormation rejects the changeset outright. Until
      # that changes, scripts/canary-release.sh performs the same rollout
      # through the alias's own weighted routing, gated on the two alarms
      # below.
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          CORS_ORIGINS: !Ref CorsOrigins
          GO_SERVICE_URL: !Ref GoServiceUrl
          PROFILE_EVENTS_TOPIC_ARN: !Ref ProfileEventsTopic
          # The pg pool lives at module scope; keep the container alive between calls.
          NODE_OPTIONS: --enable-source-maps
      VpcConfig:
        SubnetIds: [!Ref SubnetIdA, !Ref SubnetIdB]
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      # Grants the ENI permissions a VPC-attached function needs.
      Policies:
        - VPCAccessPolicy: {}
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ProfileEventsTopic.TopicName
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Hono owns CORS so that error responses carry the headers too.
      Description: Public entry point for the collector

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CollectorFunction}
      RetentionInDays: 7

  # ---- Async introduction: profile.saved -> SNS -> SQS -> worker -> Go ----
  #
  # Saving a profile stays synchronous. Generating its introduction does not:
  # it is announced as an event, so a slow or broken Go service can never roll
  # back a profile that was already committed.

  ProfileEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Profile lifecycle events (profile.saved)

  # Retries are capped by maxReceiveCount below; whatever still fails lands
  # here, where it can be inspected and replayed rather than lost.
  IntroductionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Two weeks is long enough to notice a DLQ alarm on a Friday and still
      # replay the messages on Monday.
      MessageRetentionPeriod: 1209600

  IntroductionQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Comfortably above the worker's 30s timeout, or SQS would hand the same
      # message to a second worker while the first is still busy with it.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IntroductionDeadLetterQueue.Arn
        maxReceiveCount: 5

  IntroductionQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref ProfileEventsTopic
      Endpoint: !GetAtt IntroductionQueue.Arn
      # Without this the worker would have to unwrap an SNS envelope around
      # every message body.
      RawMessageDelivery: true

  IntroductionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref IntroductionQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt IntroductionQueue.Arn
            Condition:
              ArnEquals: {"aws:SourceArn": !Ref ProfileEventsTopic}

  IntroductionWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: worker.handler
      Description: Turns profile.saved into a generated introduction via the Go service
      # Generous next to the Go call's own 5s timeout, so a slow container
      # costs a retry rather than a truncated request.
      Timeout: 30
      Environment:
        Variables:
          GO_SERVICE_URL: !Ref GoServiceUrl
          NODE_OPTIONS: --enable-source-maps
      # In the VPC because the Go service is only reachable there.
      VpcConfig:
        SubnetIds: [!Ref SubnetIdA, !Ref SubnetIdB]
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Policies:
        - VPCAccessPolicy: {}
      Events:
        IntroductionQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt IntroductionQueue.Arn
            BatchSize: 5
            # Lets the worker fail one message without dragging its healthy
            # batch mates back onto the queue.
            FunctionResponseTypes: [ReportBatchItemFailures]

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${IntroductionWorkerFunction}
      RetentionInDays: 7

  # ---- Alerting ----

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: zuoye operational alerts

  # A message in the DLQ means five attempts were not enough: someone has to
  # look at it, so it pages rather than sitting there silently.
  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Introduction events landed in the dead letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IntroductionDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The queue draining slower than it fills means the worker is stuck or
  # throttled; the age of the oldest message shows that before the DLQ does.
  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Introduction events are waiting too long to be processed
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IntroductionQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---- Release guard rails ----
  #
  # Both alarms watch the `live` alias, which is what real traffic goes
  # through. During a canary release the alias is split between the old and
  # new versions, so a broken new version shows up here within a minute —
  # that is the signal scripts/canary-release.sh rolls back on. Between
  # releases the same two alarms serve as ordinary health alarms.

  ReleaseErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # Fixed name so the release script can poll it without looking up
      # CloudFormation's generated identifier.
      AlarmName: !Sub "${AWS::StackName}-release-errors"
      AlarmDescription: The version being rolled out is throwing errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: Resource
          Value: !Sub "${CollectorFunction}:live"
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  ReleaseLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-release-latency"
      AlarmDescription: The version being rolled out is far slower than usual
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: Resource
          Value: !Sub "${CollectorFunction}:live"
        - Name: FunctionName
          Value: !Ref CollectorFunction
      # p90 rather than average: a handful of cold starts shouldn't roll back
      # an otherwise healthy release.
      ExtendedStatistic: p90
      Period: 60
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---- Synthetics: probe the real chain on a schedule ----
  #
  # Everything here is conditional. The canary bills per run, and its
  # underlying Lambda asks for 960 MB, which this account's 512 MB cap
  # rejects — so it stays off until the quota increase lands.

  SyntheticsArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: CreateSyntheticsCanary
    # Retained on purpose: a non-empty bucket would otherwise block the whole
    # stack from deleting.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCanaryArtifacts
            Status: Enabled
            ExpirationInDays: 14

  SyntheticsCanaryRole:
    Type: AWS::IAM::Role
    Condition: CreateSyntheticsCanary
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteSyntheticsResults
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetBucketLocation]
                Resource:
                  - !GetAtt SyntheticsArtifactBucket.Arn
                  - !Sub "${SyntheticsArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: {"cloudwatch:namespace": CloudWatchSynthetics}

  ApiReadinessCanary:
    Type: AWS::Synthetics::Canary
    Condition: CreateSyntheticsCanary
    Properties:
      Name: zuoye-api-ready
      ArtifactS3Location: !Sub "s3://${SyntheticsArtifactBucket}/canary"
      ExecutionRoleArn: !GetAtt SyntheticsCanaryRole.Arn
      # The plain nodejs runtime is enough — and cheaper — for a check that
      # never renders a page.
      RuntimeVersion: syn-nodejs-5.2
      Schedule:
        Expression: !Sub "rate(${SyntheticsScheduleMinutes} minutes)"
      RunConfig:
        TimeoutInSeconds: 60
        EnvironmentVariables:
          API_HOST: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 7
      FailureRetentionPeriod: 14
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');

          // /ready walks API Gateway -> Lambda -> Go on ECS -> PostgreSQL and
          // touches no user data, so the probe needs no credentials.
          exports.handler = async function () {
            const options = {
              hostname: process.env.API_HOST,
              method: 'GET',
              path: '/ready',
              port: 443,
              protocol: 'https:',
              headers: { 'User-Agent': 'zuoye-synthetics' },
            };

            await synthetics.executeHttpStep('ready', options, async (res) => {
              let body = '';
              res.on('data', (d) => { body += d; });
              await new Promise((resolve) => res.on('end', resolve));
              if (res.statusCode !== 200) {
                throw new Error(`ready returned ${res.statusCode}: ${body.slice(0, 300)}`);
              }
              log.info(`ready ok: ${body.slice(0, 200)}`);
            });
          };

  SyntheticsFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateSyntheticsCanary
    Properties:
      AlarmName: !Sub "${AWS::StackName}-synthetics-failed"
      AlarmDescription: Readiness canary is failing
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref ApiReadinessCanary
      Statistic: Average
      # Seconds, and deliberately a little wider than the default 60-minute
      # schedule so one late run isn't read as a missing data point.
      Period: 3900
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # Lambda has no IP, so it can't live in a DNS record like the Go service
  # does. A service with no DnsConfig is API-discoverable only: the Go
  # service finds this function via DiscoverInstances, then invokes it.
  CollectorDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref CloudMapServiceName
      NamespaceId: !Ref CloudMapNamespaceId
      Description: API-type registration of the collector Lambda

  CollectorDiscoveryInstance:
    Type: AWS::ServiceDiscovery::Instance
    Properties:
      ServiceId: !Ref CollectorDiscoveryService
      InstanceId: collector
      InstanceAttributes:
        functionName: !Ref CollectorFunction
        arn: !GetAtt CollectorFunction.Arn

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

  FunctionName:
    Description: Lambda function name
    Value: !Ref CollectorFunction

  IntroductionQueueUrl:
    Description: Main introduction queue
    Value: !Ref IntroductionQueue

  DeadLetterQueueUrl:
    Description: Dead letter queue for exhausted introduction events
    Value: !Ref IntroductionDeadLetterQueue

  ProfileEventsTopicArn:
    Description: SNS topic carrying profile.saved
    Value: !Ref ProfileEventsTopic

  AlertsTopicArn:
    Description: SNS topic every operational alarm publishes to
    Value: !Ref AlertsTopic

  ReadinessUrl:
    Description: One call that exercises Lambda, the Go service and PostgreSQL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/ready"
