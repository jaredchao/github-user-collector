services:
  postgres:
    image: postgres:16-alpine
    container_name: zuowen-postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: github_users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d github_users"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
