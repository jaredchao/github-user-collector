name: PR environment (go-service)

# The Go service is the single front door, so a backend-only PR also needs
# its own Go instance — same code as main, but its Cloud Map target points
# at that PR's Lambda stack.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "go-service/**"
      - "backend/**"
      - "scripts/pr-env-up.sh"
      - ".github/workflows/pr-env.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

# One deploy at a time per PR; a second push waits instead of racing the first.
concurrency:
  group: pr-env-${{ github.event.number }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  SOURCE_BUCKET: zuoye-codebuild-source-089783390738
  CODEBUILD_PROJECT: zuoye-go-service
  IMAGE: 089783390738.dkr.ecr.us-east-2.amazonaws.com/zuoye-go-service
  # CodeBuild is the intended build path, but this new AWS account has its
  # concurrent-build limit locked at 0 (support case 178383926300453 denied:
  # "build more account history"). Until AWS lifts it, build on the runner
  # with buildx instead. Flip to "true" once the quota is granted.
  USE_CODEBUILD: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Account id is not a secret; hardcoding keeps setup reproducible.
          role-to-assume: arn:aws:iam::089783390738:role/zuoye-github-oidc-role
          aws-region: us-east-2

      - name: Upload source to S3
        if: env.USE_CODEBUILD == 'true'
        run: |
          zip -qr source.zip go-service
          aws s3 cp source.zip "s3://$SOURCE_BUCKET/pr-${{ github.event.number }}/source.zip"

      - name: Build image on CodeBuild
        if: env.USE_CODEBUILD == 'true'
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name "$CODEBUILD_PROJECT" \
            --source-location-override "$SOURCE_BUCKET/pr-${{ github.event.number }}/source.zip" \
            --environment-variables-override "name=IMAGE_TAG,value=pr-${{ github.event.number }},type=PLAINTEXT" \
            --query 'build.id' --output text)
          echo "build: $BUILD_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text)
            echo "  $STATUS"
            case "$STATUS" in
              SUCCEEDED) break ;;
              IN_PROGRESS) sleep 15 ;;
              *) echo "build ended with $STATUS"; exit 1 ;;
            esac
          done

      # Fallback path while the CodeBuild quota is locked at 0: cross-build
      # the ARM64 image on the runner via QEMU. Same Dockerfile, same tag.
      - name: Set up QEMU
        if: env.USE_CODEBUILD != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        if: env.USE_CODEBUILD != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image on the runner
        if: env.USE_CODEBUILD != 'true'
        run: |
          aws ecr get-login-password | docker login --username AWS \
            --password-stdin 089783390738.dkr.ecr.us-east-2.amazonaws.com
          docker buildx build --platform linux/arm64 --push \
            -t "$IMAGE:pr-${{ github.event.number }}" go-service

      - name: Choose the collector Lambda for this environment
        id: collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view ${{ github.event.number }} --json files -q '.files[].path' | grep -q '^backend/'; then
            echo "service=collector-lambda-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "service=collector-lambda" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or refresh the PR environment
        env:
          PR_NUMBER: ${{ github.event.number }}
          COLLECTOR_SERVICE: ${{ steps.collector.outputs.service }}
        run: bash scripts/pr-env-up.sh

      - name: Comment the environment URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- pr-env -->"
          BODY="$MARKER
          PR 环境已就绪: https://pr-${{ github.event.number }}.go-api.jccode.cc

          试一下: \`curl 'https://pr-${{ github.event.number }}.go-api.jccode.cc/intro?username=torvalds'\`
          （PR 关闭时环境自动销毁）"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" -f body="$BODY"
          fi
