name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    # Backend-only PRs also get a clickable preview: the frontend is built
    # from this branch (same as main for those PRs) but wired to the PR's
    # own backend(s).
    paths:
      - "frontend/**"
      - "backend/**"
      - "go-service/**"
      - ".github/workflows/frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  preview:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the default set entirely, so the OIDC
      # token grant must be spelled out here or AWS credentials fail to load.
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      # The Go service is the single front door, so the preview only needs
      # one URL, and it's deterministic (host-header routing on the ALB).
      # Any backend change means the PR has its own Go front door; a
      # frontend-only PR talks to production.
      - name: Choose the Go front door for this preview
        id: apis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view ${{ github.event.number }} --json files -q '.files[].path' | grep -qE '^(go-service|backend)/'; then
            echo "go_url=https://pr-${{ github.event.number }}.go-api.jccode.cc" >> "$GITHUB_OUTPUT"
          else
            echo "go_url=https://main.go-api.jccode.cc" >> "$GITHUB_OUTPUT"
          fi

      # Real environment variables beat .env.production in Vite, so this
      # rebuild bakes the preview's backend into the bundle.
      - run: npm run build
        working-directory: frontend
        env:
          VITE_GO_API_URL: ${{ steps.apis.outputs.go_url }}

      - name: Publish the preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=zuoye-frontend --branch=pr-${{ github.event.number }}

      - name: Comment the preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- fe-preview -->"
          BODY="$MARKER
          前端预览已就绪: https://pr-${{ github.event.number }}.zuoye-frontend.pages.dev
          （统一入口: ${{ steps.apis.outputs.go_url }}）"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" -f body="$BODY"
          fi

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=zuoye-frontend --branch=main
